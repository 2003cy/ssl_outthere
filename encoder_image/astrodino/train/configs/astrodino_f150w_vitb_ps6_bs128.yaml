# AstroDINO/iBOT — ViT-Base, patch_size=6, batch=512 (4 GPU × 128)
# Changes from astrodino_jwst_vitb_f150w.yaml:
#   patch_size    : 4  → 6   (3× PSF FWHM per patch side, above diffraction limit)
#   global_crops_size: 64 → 72  (72 % 6 == 0)
#   local_crops_size : 32 → 36  (36 % 6 == 0)
#   batch_size_per_gpu: 90 → 128 (4×128=512 → sqrt_wrt_1024 factor=0.707, effective_lr=7.07e-5)

MODEL:
  WEIGHTS: ''

compute_precision:
  grad_scaler: true
  teacher:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
  student:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32

# DINO head settings
dino:
  loss_weight: 1.1
  head_n_prototypes: 16384
  head_bottleneck_dim: 192
  head_nlayers: 3
  head_hidden_dim: 768
  koleo_loss_weight: 0.03

# iBOT settings
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5          # increased from 0.3; more iBOT signal per step
  mask_ratio_min_max:
  - 0.1
  - 0.3
  separate_head: false
  head_n_prototypes: 16384
  head_bottleneck_dim: 192
  head_nlayers: 3
  head_hidden_dim: 768

# Training
train:
  batch_size_per_gpu: 128               # 4 GPUs × 128 = 512; effective_lr = base_lr × 0.707
  dataset_path: "jwst:split=train:root=/u/yacheng/projects/ssl_outthere/images/jwst/:filter=f150w"
  output_dir: .
  saveckp_freq: 5
  seed: 0
  num_workers: 16
  OFFICIAL_EPOCH_LENGTH: 1000
  cache_dataset: true
  centering: "centering"
  re_min_pix: 2.0
  re_max_pix: null

student:
  arch: vit_base
  in_chans: 1                           # single-channel JWST input
  patch_size: 6                         # 6×6 px = 180 mas = 3× PSF FWHM
  embed_dim: 512
  num_heads: 8
  drop_path_rate: 0.2
  layerscale: 1.0e-05
  drop_path_uniform: true
  pretrained_weights: ''
  ffn_layer: "mlp"
  block_chunks: 4
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 7

# Teacher schedule
teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 10

optim:
  epochs: 300
  weight_decay: 0.004
  weight_decay_end: 0.04
  base_lr: 1e-4                         # batch=512 → scaling=0.707 → effective_lr = 7.07e-5
  lr: 0.
  warmup_epochs: 5
  min_lr: 5.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 2
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  local_crops_number: 8
  global_crops_size: 72                 # 72 % 6 == 0; (72/6)²+8 = 152 tokens
  local_crops_size: 36                  # 36 % 6 == 0; (36/6)²+8 = 44 tokens
  center_crop_size: 100

evaluation:
  eval_period_iterations: 1000