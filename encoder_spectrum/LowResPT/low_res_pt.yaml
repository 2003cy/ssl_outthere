model:
  embed_dim: 128
  num_layers: 8
  num_heads: 4
  mlp_ratio: 4.0
  dropout: 0.1
  patch_size: 4
  stride: 2
  patch_invalid_threshold: 0.25
  mask_ratio: 0.5
  min_unmasked: 4
  max_line_blocks: 0
  num_line_detect: 3  # detect the top N strongest lines
  continuous_patch_length: 2
  line_prominence: 1.2
  min_std: 0.02
  use_patch_stats: true  
  decoder_hidden_dims: [] #no hidden dim -> linear decoder
  line_loss_weight: 3.0
  selected_mask_prob:  1  #probability of masking from "selected" pool
  lr: 3.0e-4
  weight_decay: 0.004
  betas: [0.9, 0.95]
  warmup_steps: 300
  min_lr: 3.0e-5

data:
  fits_path: /home/yacheng/ssl_outthere/images/DJA/DJA_spectra_v4.5.fits
  batch_size: 512
  num_workers: 8
  train_val_split: 0.9
  use_infinite_sampler: true
  # Grade / obs-fraction pre-selection (previously baked into the HDF5 build).
  grades: [1, 2, 3]
  min_obs_frac: 0.5
  min_sn50: 1.0
  min_redshift: 0.0
  max_redshift: null   # null = no upper-z cut (keep all z > min_redshift)
  # false (default) = convert flux to f_lambda (∝ f_nu/λ²); true = raw uJy (f_nu)
  use_jansky: false
  # Observed-frame wavelength window (µm) — cuts each spectrum to this range at
  # the dataset level AND sets the positional-encoding reference range.
  wl_ref_min: 0.53
  wl_ref_max: 5.6

trainer:
  max_epochs: 400
  enable_progress_bar: false
  accelerator: gpu
  devices: [0]
  precision: 16-mixed
  log_every_n_steps: 10   #
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/
      name: low_res_pt
  callbacks:
    - class_path: callbacks.EpochPrinter
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_hid_loss
        save_top_k: 3
        mode: min
        filename: "epoch={epoch}-val_hid_loss={val_hid_loss:.4f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_hid_loss
        patience: 80
        mode: min
