model:
  embed_dim: 256
  num_layers: 8
  num_heads: 4
  mlp_ratio: 4.0
  dropout: 0
  patch_size: 4
  stride: 2
  patch_invalid_threshold: 0.25
  mask_ratio: 0.5
  min_unmasked: 4
  max_line_blocks: 0
  num_line_detect: 3  # detect the top N strongest lines
  continuous_patch_length: 2
  line_prominence: 1.2
  min_std: 0
  use_patch_stats: True  
  decoder_hidden_dims: [] #no hidden dim -> linear decoder
  line_loss_weight: 0.0
  selected_mask_prob:  1  #probability of masking from "selected" pool
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  warmup_steps: 2000
  min_lr: 1.0e-6

data:
  fits_path: /home/yacheng/ssl_outthere/data/spectrum/DJA_spectra_v4.5.fits
  batch_size: 1024
  num_workers: 8
  train_val_split: 0.9
  use_infinite_sampler: true
  # Grade / obs-fraction pre-selection (previously baked into the HDF5 build).
  grades: [1, 2, 3]
  min_obs_frac: 0. #test parameter, valid spectrum overlap fraction with F150W 
  min_sn50: 0
  min_redshift: 0.0
  max_redshift: null   # null = no upper-z cut (keep all z > min_redshift)
  frac_valid_pix: 0.5  # keep spectra with > this valid-pixel fraction in [wl_ref_min,wl_ref_max] ([0,1]; null = no cut)
  use_jansky: false    # false (default) = convert flux to f_lambda (∝ f_nu/λ²); true = raw uJy (f_nu)
  # Observed-frame wavelength window (µm) — cuts each spectrum to this range
  wl_ref_min: 0.53
  wl_ref_max: 5.6

trainer:
  max_epochs: 400
  enable_progress_bar: false
  accelerator: gpu
  devices: [0]
  precision: 16-mixed
  log_every_n_steps: 10   #
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/
      name: low_res_pt
  callbacks:
    - class_path: callbacks.EpochPrinter
    - class_path: callbacks.PlotMetrics
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_hid_loss
        save_top_k: 3
        mode: min
        filename: "epoch={epoch}-val_hid_loss={val_hid_loss:.4f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_hid_loss
        patience: 80
        mode: min
