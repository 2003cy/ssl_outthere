seed_everything: 57

# Model settings (optimized for 70-100 token spectra)
model:
  embed_dim: 64
  num_layers: 4
  num_heads: 4      # head_dim = 16
  mlp_ratio: 4.0
  max_len: 128
  mask_ratio: 0.20
  min_unmasked: 15
  dropout: 0.1
  bias: true

# Optimizer and LR Scheduler settings (LightningCLI auto-config)
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.0e-3
    weight_decay: 0.01

lr_scheduler: null  # Use custom callback instead

# Data settings
data:
  h5_path: /u/yacheng/projects/ssl_outthere/data/survey/OUTTHERE/spectrum/f150w.h5
  batch_size: 128  # Increased from 64 for single GPU, better optimization
  num_workers: 4
  train_val_split: 0.9
  collate_fn: null
  valid_flux_mask_fn: null
  use_infinite_sampler: true  # Enable infinite loop for masked modeling
  min_snr: 10  # Minimum SNR threshold for filtering low-quality spectra

# Trainer settings
trainer:
  #max_steps: 10000  # Use max_steps instead of max_epochs for infinite sampler
  max_epochs: 15  # Disable epoch limit
  accelerator: gpu
  devices: [0]  # Use first GPU
  strategy: auto
  precision: 16-mixed  # Mixed precision training (faster)
  log_every_n_steps: 10
  #val_check_interval: 100  # Validate every 100 steps (must be <= num_batches_per_epoch when not using step-based validation)
  check_val_every_n_epoch: 1 # Disable epoch-based validation so val_check_interval is interpreted as steps
  enable_checkpointing: true
  enable_progress_bar: true
  default_root_dir: ./outputs
  logger: false  # Disable TensorBoard logger
  callbacks:
    - class_path: model.callbacks.RunManager
      init_args:
        run_name: f150w_grism  # Change this for different runs
        base_dir: ./outputs
        config_path: ./ma_specformer_single_gpu.yaml
    - class_path: model.callbacks.MetricsSaveCallback
      init_args:
        save_every_n_steps: 10
    - class_path: model.callbacks.WarmupCosineLR
      init_args:
        warmup_steps: 80
        base_lr: 1.0e-3
        min_lr: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "ckpt-{epoch:02d}-{val_loss:.4f}"
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 10
        mode: min