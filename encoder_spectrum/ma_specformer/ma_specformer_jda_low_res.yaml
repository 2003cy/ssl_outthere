#python data/trainer_jda.py fit --config ma_specformer_jda_low_res.yaml 
seed_everything: 57

# Model settings (tuned for JDA PRISM/F100LP spectra, ~56 pixels in 1-2 µm)
model:
  embed_dim: 64      # 64 → 128: dataset is ~10x larger (20K spectra), more capacity is justified
  num_layers: 8    
  num_heads: 8
  mlp_ratio: 4.0
  max_len: 100       # 64 → 2048: accommodates the 1666-pixel F100LP/G140M group (next power-of-2 ceiling)
  mask_ratio: 0.30    # 0.50: 28/56 tokens masked; symmetric context
  min_unmasked: 10    # keeps at least 10 tokens visible
  block_size: 6       # mask contiguous blocks of 4 pixels (~720 Å at PRISM R~100)
  cls_aux_weight: 1  # auxiliary loss on CLS token; encourages global context learning
  dropout: 0.1
  bias: true

# Optimizer
optimizer:
  class_path: torch.optim.adamw.AdamW
  init_args:
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.95]
    
lr_scheduler: null  # Custom WarmupCosineLR callback below

# Data settings
data:
  h5_path: /home/yacheng/ssl_outthere/images/JDA/jda_spectra_low.h5
  batch_size: 256  
  num_workers: 4
  train_val_split: 0.9
  use_infinite_sampler: true
  min_sn50: 2.0          # mild quality cut; removes the very noisiest spectra
  min_length: 0        # strict lower bound: keeps length > 100 (excludes 56-pixel PRISM group)
  max_length: 100       # upper bound: keeps length <= 1999 (excludes 3971-pixel group)

# Trainer settings
trainer:
  max_epochs: 100          
  accelerator: gpu
  devices: [0]
  strategy: auto
  precision: 16-mixed
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  enable_progress_bar: true
  default_root_dir: ./outputs
  logger: false
  callbacks:
    - class_path: model.callbacks.RunManager
      init_args:
        run_name: jda_prism_f100lp
        base_dir: ./outputs
        config_path: ./ma_specformer_jda_low_res.yaml
    - class_path: model.callbacks.MetricsSaveCallback
      init_args:
        save_every_n_steps: 10
    - class_path: model.callbacks.WarmupCosineLR
      init_args:
        warmup_steps: 300  # 80 → 200: larger dataset + larger batch needs a longer ramp-up
        base_lr: 2.0e-4
        min_lr: 2.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "ckpt-{epoch:02d}-{val_loss:.4f}"
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 10
        mode: min
