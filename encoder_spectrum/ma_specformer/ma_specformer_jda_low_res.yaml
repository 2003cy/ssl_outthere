#python data/trainer_jda.py fit --config ma_specformer_jda_low_res.yaml 
seed_everything: 1

# Model settings (tuned for JDA PRISM/F100LP spectra, ~56 pixels in 1-2 µm)
model:
  embed_dim: 64      # 64 → 128: dataset is ~10x larger (20K spectra), more capacity is justified
  num_layers: 8    
  num_heads: 8
  mlp_ratio: 4.0
  mask_ratio: 0.40    # 40% of valid tokens masked per sample
  min_unmasked: 10    # keeps at least 10 tokens visible
  block_size: 2       # mask contiguous blocks of 2 pixels (~360 Å at PRISM R~100)
  cls_aux_weight: 0.8  # auxiliary loss on CLS token; encourages global context learning
  dropout: 0.1
  bias: true

# Optimizer
optimizer:
  class_path: torch.optim.adamw.AdamW
  init_args:
    lr: 2.0e-4      # overridden every step by WarmupCosineLR; set to base_lr for clarity
    weight_decay: 0.01
    betas: [0.9, 0.95]

lr_scheduler: null  # Custom WarmupCosineLR callback below

# Data settings
data:
  h5_path: /home/yacheng/ssl_outthere/images/JDA/jda_spectra_low.h5
  batch_size: 256  
  num_workers: 4
  train_val_split: 0.9
  use_infinite_sampler: true
  min_sn50: 3
  min_length: 0        # no lower bound; all spectra with length >= 0 are included
  max_length: 100       # keeps only PRISM/F100LP spectra (~56 pixels); excludes longer grisms

# Trainer settings
trainer:
  max_epochs: 100          
  accelerator: gpu
  devices: [0]
  strategy: auto
  precision: 16-mixed
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  enable_progress_bar: true
  default_root_dir: ./outputs
  logger: false
  callbacks:
    - class_path: model.callbacks.RunManager
      init_args:
        run_name: jda_prism_f100lp
        base_dir: ./outputs
        config_path: ./ma_specformer_jda_low_res.yaml
    - class_path: model.callbacks.MetricsSaveCallback
      init_args:
        save_every_n_steps: 10
    - class_path: model.callbacks.WarmupCosineLR
      init_args:
        warmup_steps: 300  # 80 → 200: larger dataset + larger batch needs a longer ramp-up
        base_lr: 2.0e-4
        min_lr: 2.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "ckpt-{epoch:02d}-{val_loss:.4f}"
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 20
        mode: min
