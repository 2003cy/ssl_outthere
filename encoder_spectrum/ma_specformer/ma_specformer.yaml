# MASpecFormer training configuration (LightningCLI YAML format)

# Trainer settings
trainer:
  max_epochs: 50
  accelerator: cpu
  strategy: auto
  precision: 32-true  # Mixed precision training (faster)
  log_every_n_steps: 10
  val_check_interval: 0.5
  enable_checkpointing: true
  enable_progress_bar: true
  default_root_dir: ./checkpoints
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: null
        filename: "ma_specformer-{epoch:02d}-{val_loss:.4f}"
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 10
        mode: min
  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: ./logs
        name: ma_specformer
        version: null

# Model settings
model:
  embed_dim: 128
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4.0
  max_len: 2048
  mask_ratio: 0.15
  min_unmasked: 1
  dropout: 0.1
  bias: true

# Data settings (example for F115W; adapt path for F150W, F200W)
data:
  h5_path: /u/yacheng/projects/ssl_outthere/images/OUTTHERE/spectrum/f115w.h5
  batch_size: 32
  num_workers: 4
  train_val_split: 0.9
  collate_fn: null
  valid_flux_mask_fn: null
