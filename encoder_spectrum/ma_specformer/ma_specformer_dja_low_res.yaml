#python data/trainer_dja.py fit --config ma_specformer_dja_low_res.yaml 
seed_everything: 15

# Model settings (tuned for DJA PRISM/F100LP spectra, ~56 pixels in 1-2 µm)
model:
  embed_dim: 32      
  num_layers: 8    
  num_heads: 8
  mlp_ratio: 4.0
  mask_ratio: 0.40        # total fraction of valid pixels to mask
  min_unmasked: 10        # keeps at least 10 tokens visible
  max_line_blocks: 3      
  line_block_size: 1      
  line_prominence: 1.3    # prominence threshold on normalised flux (std=1)
  cls_aux_weight: 0.
  dropout: 0.01
  bias: true
  redshift_corr: true

# Optimizer
optimizer:
  class_path: torch.optim.adamw.AdamW
  init_args:
    lr: 2.0e-4      # overridden every step by WarmupCosineLR; set to base_lr for clarity
    weight_decay: 0.01
    betas: [0.9, 0.95]

lr_scheduler: null  # Custom WarmupCosineLR callback below

# Data settings
data:
  h5_path: /home/yacheng/ssl_outthere/data/spectrum/dja_spectra_low.h5
  batch_size: 256
  num_workers: 4
  train_val_split: 0.9
  use_infinite_sampler: true
  min_sn50: 3
  min_length: 0        # no lower bound; all spectra with length >= 0 are included
  max_length: 100       # keeps only PRISM/F100LP spectra (~56 pixels); excludes longer grisms
  min_redshift: 0.0     # exclude samples with z_best <= 0 (invalid redshift, e.g. -1)

# Trainer settings
trainer:
  max_epochs: 200          
  accelerator: gpu
  devices: [0]
  strategy: auto
  precision: 16-mixed
  log_every_n_steps: 10
  check_val_every_n_epoch: 4
  enable_checkpointing: true
  enable_progress_bar: true
  default_root_dir: ./outputs
  logger: false
  callbacks:
    - class_path: model.callbacks.RunManager
      init_args:
        run_name: dja_prism_f100lp
        base_dir: ./outputs
        config_path: ./ma_specformer_dja_low_res.yaml
    - class_path: model.callbacks.MetricsSaveCallback
      init_args:
        save_every_n_steps: 10
    - class_path: model.callbacks.WarmupCosineLR
      init_args:
        warmup_steps: 400  # 80 → 200: larger dataset + larger batch needs a longer ramp-up
        base_lr: 5.0e-5
        min_lr: 5.0e-6
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "ckpt-{epoch:02d}-{val_loss:.4f}"
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 30
        mode: min