# HPO trial config — loaded AFTER the base config, overrides HPO-relevant settings.
# Usage:  python data/trainer_jda.py fit \
#           --config ma_specformer_jda_low_res.yaml \
#           --config _optuna.yaml \
#           --model.embed_dim=64 ...
#
# LR scaling:
#   base_lr is read from optimizer.init_args.lr (set via CLI per trial).
#   warmup_steps = round(400 * max_epochs / 200)  → 80 for 40-epoch trials.
#   min_lr is derived automatically as base_lr * 0.1 inside WarmupCosineLR.

trainer:
  max_epochs: 40
  check_val_every_n_epoch: 4

  # Redefine all callbacks for HPO (Lightning CLI replaces the list from base config).
  callbacks:
    - class_path: model.callbacks.RunManager
      init_args:
        run_name: optuna
        base_dir: ./outputs

    - class_path: model.callbacks.MetricsSaveCallback
      init_args:
        save_every_n_steps: 10

    - class_path: model.callbacks.WarmupCosineLR
      init_args:
        warmup_steps: 80   # 400 * 40 / 200
        base_lr: null      # reads optimizer initial lr → set via --optimizer.init_args.lr
        min_lr: null       # derived as base_lr * 0.1 inside callback

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "ckpt-{epoch:02d}-{val_loss:.4f}"
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: false

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 10
        mode: min
