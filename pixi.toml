[workspace]
name = "ssl_outthere"
version = "0.0.1"
description = "Multi modal, SSL representation learning and downstream tasks for JWST NIRISS/NIRCam images and spectra"
channels = ["conda-forge"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# PyPI index configuration
# ---------------------------------------------------------------------------
[pypi-options]
extra-index-urls = [
    "https://pypi.nvidia.com",
]
# Allow uv to search all indexes for the best matching version instead of
# stopping at the first index that contains a given package name.
index-strategy = "unsafe-best-match"

# ---------------------------------------------------------------------------
# Conda dependencies
# ---------------------------------------------------------------------------
[dependencies]
python      = ">=3.10,<3.12"
pip         = ">=23.0"
# conda-forge setuptools>=71 dropped pkg_resources; pin to a version that still ships it
setuptools  = ">=65.0,<71.0"
packaging   = ">=20.0,<25.0"
fsspec      = ">=2022.5.0,<2026.0"
numpy       = "==1.26.4"
scipy       = ">=1.10"
# cap mpmath so the conda solve stays compatible with the sympy (<1.4 mpmath)
# pulled by torch's pypi deps (torch 2.5.1 -> sympy 1.13.1 -> mpmath>=1.1,<1.4)
mpmath      = ">=1.1.0,<1.4"
astropy     = ">=5.0"
scikit-image = ">=0.19"
scikit-learn = ">=1.0"
pyarrow     = ">=12.0"
pycairo     = ">=1.20"
ipykernel   = ">=6.0"
libstdcxx-ng = ">=15.2.0,<16"
wandb = ">=0.26.1,<0.27"

# ---------------------------------------------------------------------------
# Activation — prepend pixi env lib so newer libstdc++ shadows the system one
# ---------------------------------------------------------------------------
[activation]
env = { LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" }

# ---------------------------------------------------------------------------
# PyPI dependencies (shared, CUDA-version-agnostic)
# NOTE: lightning / torchmetrics are NOT here — they are pinned per-feature
# because they are torch-version-coupled (lightning 2.5 is the first release to
# officially support torch 2.5; 2.3.3 only fits the torch-2.0.1 meta/h100 envs).
# ---------------------------------------------------------------------------
[pypi-dependencies]
# Data / cloud
boto3          = ">=1.28.17"
datasets       = ">=2.14"
huggingface_hub = ">=0.16"

# Config and utilities
omegaconf      = ">=2.3.0"
python-dotenv  = ">=1.0"
jaxtyping      = ">=0.2"
submitit       = ">=1.4"
plotly         = ">=5.0"
wandb          = ">=0.15"

# Probabilistic programming
pyro-ppl       = ">=1.8"

# Galaxy SED fitting
provabgs = {git = "https://github.com/changhoonhahn/provabgs.git"}

#optuna for hyperparameter tunning
optuna = ">=3.0"

#shap for model interpretability
shap = ">=0.41.0"

# This package itself (editable install)
ssl_outthere = {path = ".", editable = true}

# ---------------------------------------------------------------------------
# Global tasks (env-agnostic). DINOv2-specific build tasks live under the
# `meta` / `h100` features, since only astrodino depends on Meta's dinov2.
# ---------------------------------------------------------------------------
[tasks]
# Register the (modern, default) pixi env as a Jupyter kernel
register-kernel = "python -m ipykernel install --user --name ssl_outthere --display-name 'ssl_outthere (pixi)'"

# ---------------------------------------------------------------------------
# meta feature — Meta's DINOv2 / astrodino ONLY (cu117, torch 2.0.1, A100/sm80).
# Pinned to torch 2.0.1 because dinov2 -> xformers==0.0.20 forces it. The H100
# (sm90) flavor of the same code is the `h100` feature below.
# ---------------------------------------------------------------------------
[feature.meta.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu117"]

[feature.meta.pypi-dependencies]
torch       = "==2.0.1+cu117"
torchvision = "==0.15.2+cu117"
# Training framework (torch-2.0.1-era versions)
lightning    = {version = "==2.3.3", extras = ["extra"]}
torchmetrics = "==0.10.3"
# DINOv2 runtime dependencies
fvcore      = ">=0.1.5"
iopath      = ">=0.1.9"
xformers    = "==0.0.20"

[feature.meta.tasks]
# DINOv2 must be installed without its deps to avoid torch/torchvision conflicts
install-dinov2 = "pip install --no-deps git+https://github.com/facebookresearch/dinov2.git@2302b6bf46953431b969155307b9bed152754069"
# Apply project-specific patches to the installed dinov2 (idempotent)
patch-dinov2 = {cmd = "python encoder_image/astrodino/patch_dinov2.py", depends-on = ["install-dinov2"]}
# cuml-cu11 is a pre-built wheel only available from the NVIDIA PyPI index;
# pixi/uv cannot resolve it without attempting a source build, so we install it directly.
install-cuml = "pip install --extra-index-url https://pypi.nvidia.com cuml-cu11"
# Register the meta env as a Jupyter kernel
register-kernel = "python -m ipykernel install --user --name ssl_meta --display-name 'ssl_outthere meta/astrodino (pixi)'"
# Full meta environment bootstrap
bootstrap = {depends-on = ["patch-dinov2", "register-kernel"]}

# ---------------------------------------------------------------------------
# modern feature — everything EXCEPT astrodino (jwst_dino, jwst_jepa,
# encoder_spectrum, data/eval scripts ...). torch 2.5.1 + cu124 has native
# flash / mem-efficient SDPA on BOTH sm80 (A100) and sm90 (H100), so a single
# wheel runs on both node types and there is no need for the explicit-softmax /
# unfold workarounds. No dinov2 / xformers.
# ---------------------------------------------------------------------------
[feature.modern.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]

[feature.modern.pypi-dependencies]
torch       = "==2.5.1+cu124"
torchvision = "==0.20.1+cu124"
# Training framework (lightning 2.5 is the first release to embrace torch 2.5)
lightning    = {version = ">=2.5,<2.6", extras = ["extra"]}
torchmetrics = ">=1.4"
matplotlib  = ">=3.5"
h5py        = ">=3.0"

[feature.modern.dependencies]
reproject = ">=0.20.0,<0.21"
umap-learn = ">=0.5.4"

# ---------------------------------------------------------------------------
# H100 feature — cu118 for sm_90 support, includes dinov2 deps (astrodino/meta)
# ---------------------------------------------------------------------------
[feature.h100.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu118"]

[feature.h100.dependencies]
python        = ">=3.10,<3.12"
numpy         = "==1.26.4"
scipy         = ">=1.10"
ipykernel     = ">=6.0"
libstdcxx-ng  = ">=15.2.0,<16"

[feature.h100.pypi-dependencies]
torch         = "==2.0.1+cu118"
torchvision   = "==0.15.2+cu118"
# Training framework (torch-2.0.1-era versions)
lightning     = {version = "==2.3.3", extras = ["extra"]}
torchmetrics  = "==0.10.3"
matplotlib    = ">=3.5"
h5py          = ">=3.0"
# DINOv2 runtime dependencies (cu118 build of xformers matches torch 2.0.1+cu118)
fvcore        = ">=0.1.5"
iopath        = ">=0.1.9"
xformers      = "==0.0.20"

[feature.h100.tasks]
# DINOv2 must be installed without its deps to avoid torch/torchvision conflicts
install-dinov2 = "pip install --no-deps git+https://github.com/facebookresearch/dinov2.git@2302b6bf46953431b969155307b9bed152754069"

# Apply project-specific patches to the installed dinov2 (idempotent)
patch-dinov2 = {cmd = "python encoder_image/astrodino/patch_dinov2.py", depends-on = ["install-dinov2"]}

# Register the h100 pixi env as a Jupyter kernel (run via `pixi run -e h100 register-kernel`)
register-kernel = "python -m ipykernel install --user --name ssl_h100 --display-name 'ssl_outthere h100 (pixi)'"

# Full h100 environment bootstrap
bootstrap = {depends-on = ["patch-dinov2", "register-kernel"]}

# ---------------------------------------------------------------------------
# Dev feature
# ---------------------------------------------------------------------------
[feature.dev.dependencies]
pytest  = ">=7.0"
black   = ">=23.0"
isort   = ">=5.0"

[environments]
# default = modern torch 2.5.1+cu124, for everything except astrodino (A100 & H100)
default = {features = ["modern"],        solve-group = "modern"}
dev     = {features = ["modern", "dev"], solve-group = "modern"}
# meta / h100 = Meta's dinov2 == astrodino only (pinned torch 2.0.1)
meta    = {features = ["meta"],          solve-group = "meta"}
h100    = {features = ["h100"],          solve-group = "h100"}


