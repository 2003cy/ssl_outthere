#pixi run register-kernel              # register the default (modern) env as a Jupyter kernel
#pixi run -e dev pytest                # run tests in the modern dev environment
#pixi run -e meta bootstrap            # astrodino: install dinov2 (--no-deps) + register kernel
#pixi run -e meta install-cuml         # astrodino: install cuml-cu11 (RAPIDS) if needed
#pixi run -e h100 bootstrap            # astrodino on H100: install dinov2 + register kernel
