# python trainer.py fit --config config_dja.yaml
seed_everything: 42

# ──────────────────────────────────────────────────────────
# Model
# ──────────────────────────────────────────────────────────
model:
  latent_dim: 256
  temperature: 0.1
  lr: 2.0e-5          # peak LR
  weight_decay: 0.04
  betas: [0.9, 0.95]
  warmup_steps: 300
  min_lr: 1.0e-6

  modalities:
    image:
      input_dim: null     # auto-detected per-token dim from image_patch_embed (→ 512)
      hidden_dim: [512, 256]
      pool: attention     # options: mean, max, meanmax, attention, cls (cls → point modality_keys at the cls dataset)
      num_heads: 8
      stats_dim: 2        # inject catalog [phot_f150w_tot_1, _etot_1] after pooling; null = off
    spectrum:
      input_dim: null     # auto-detected per-token dim from spectrum_patch_embed (→ 64)
      hidden_dim: [128, 256]
      pool: attention     # options: mean, max, meanmax, attention, cls (cls → point modality_keys at the cls dataset)
      num_heads: 4
      stats_dim: 2        # inject per-sample [mean, std] (absolute flux scale) after pooling; null = off

# ──────────────────────────────────────────────────────────
# Data  (token-level embeddings written by train_dja.ipynb)
# ──────────────────────────────────────────────────────────
data:
  h5_path: embeddings.h5          # standalone embeddings file written by train_dja.ipynb
  modality_keys:
    # For pool: cls, point the modality at its CLS dataset (2-D, N×D).
    image:    image_patch_embed     # [image_patch_embed or image_cls_embed](N, 512)
    spectrum: spectrum_patch_embed  # [spectrum_patch_embed or spectrum_cls_embed](N, Nspec, 64)
  token_mask_keys:
    spectrum: spectrum_token_mask   # (N, Nspec) bool; image patches are all valid
  stats_keys:
    spectrum: spectrum_stats        # (N, 2) per-sample [mean, std]; injected after pooling
    image:    image_stats           # (N, 2) catalog [f150w_tot, f150w_etot]; injected after pooling
  batch_size: 512
  num_workers: 4
  train_val_split: 0.9
  modality_mask_prob: 0.05   # set > 0 (e.g. 0.1) to randomly mask modalities during training
  min_sn50: 1             # exclude spectra with sn50  (mirrors LowResPT min_sn50)
  frac_valid_pix: 0.5     # Keep spectra whose valid-token fraction > (mirrors LowResPT frac_valid_pix).


# ──────────────────────────────────────────────────────────
# Trainer
# ──────────────────────────────────────────────────────────
trainer:
  max_epochs: 400
  accelerator: gpu
  devices: [0]
  precision: 16-mixed
  log_every_n_steps: 10
  enable_progress_bar: false   # EpochPrinter prints one clean line per epoch instead
  # ModelCheckpoint with no dirpath nests checkpoints/ in this version directory.
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/
      name: fusion_dja_image_attn_spectrum_attn
  callbacks:
    - class_path: model.callbacks.EpochPrinter
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_R@10        # retrieval is the goal; R@10 is smoother than R@1
        mode: max
        save_top_k: 3
        save_last: true
        filename: "epoch={epoch}-R10={val_R@10:.3f}-val_loss={val_loss:.4f}"
        auto_insert_metric_name: false   # template already names metrics; avoids "epoch=epoch=..."
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_R@10
        patience: 70
        mode: max
