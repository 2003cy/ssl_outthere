# python trainer.py fit --config config_dja.yaml
seed_everything: 42

# ──────────────────────────────────────────────────────────
# Model
# ──────────────────────────────────────────────────────────
model:
  latent_dim: 256
  temperature: 0.1
  lr: 1.0e-3          # peak LR — best of the {2e-5, 3e-4, 1e-3} sweep (2e-5 underfit)
  weight_decay: 0.04
  betas: [0.9, 0.95]
  warmup_steps: 1000  # ~55 epochs to peak (18 steps/epoch); sized for the 1e-3 LR
  min_lr: 1.0e-6

  modalities:
    image:
      input_dim: null     # auto-detected per-token dim from image_patch_embed (→ 512)
      hidden_dim: [512, 256]
      pool: attention     # options: mean, max, meanmax, attention, cls (cls → point modality_keys at the cls dataset)
      num_heads: 8
      stats_dim: 2                       # inject raw-cutout [mean, std] after pooling; null = off
      stats_scale: [0.001397, 0.01009]   # per-column asinh reference (median|.| of the raw crop stats)
    spectrum:
      input_dim: null     # auto-detected per-token dim from spectrum_patch_embed (→ 128)
      hidden_dim: [128, 256]
      pool: attention     # options: mean, max, meanmax, attention, cls (cls → point modality_keys at the cls dataset)
      num_heads: 4
      stats_dim: 2                       # inject raw-flux [mean, std] after pooling; null = off
      stats_scale: [0.02695, 0.0138]     # per-column asinh reference (median|.| of the raw f_lambda stats)

# ──────────────────────────────────────────────────────────
# Data  (token-level embeddings written by data/survey/crossmatch/compute_embeddings.py)
# ──────────────────────────────────────────────────────────
data:
  h5_path: ../data/crossmatched/embeddings_f150w.h5   # DJA×F150W crossmatch, 4 surveys
  modality_keys:
    # For pool: cls, point the modality at its CLS dataset (2-D, N×D).
    image:    image_patch_embed     # [image_patch_embed or image_cls_embed](N, 529, 512)
    spectrum: spectrum_patch_embed  # [spectrum_patch_embed or spectrum_cls_embed](N, 27, 128)
  token_mask_keys:
    spectrum: spectrum_token_mask   # (N, 27) bool; image patches are all valid
  stats_keys:
    spectrum: spectrum_stats        # (N, 2) raw f_lambda [mean, std]; injected after pooling
    image:    image_stats           # (N, 2) raw centre-crop [mean, std]; injected after pooling
  # One spectrum can match cutouts in several surveys → duplicate dja_id rows.
  # Group the split by id so a spectrum never straddles train/val.
  group_key: id
  batch_size: 512
  num_workers: 4
  train_val_split: 0.9
  modality_mask_prob: 0.05   # set > 0 (e.g. 0.1) to randomly mask modalities during training
  min_sn50: 0             # 0 disables the cut; align on every crossmatched pair
  frac_valid_pix: 0.0     # 0 disables the cut; build_crossmatch already requires > 50% valid pixels


# ──────────────────────────────────────────────────────────
# Trainer
# ──────────────────────────────────────────────────────────
trainer:
  max_epochs: 400
  accelerator: gpu
  devices: [0]
  precision: 16-mixed
  log_every_n_steps: 10
  enable_progress_bar: false   # EpochPrinter prints one clean line per epoch instead
  # ModelCheckpoint with no dirpath nests checkpoints/ in this version directory.
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/
      name: fusion_dja_image_attn_spectrum_attn
  callbacks:
    - class_path: model.callbacks.EpochPrinter
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_R@10        # retrieval is the goal; val_loss can rise while R@10 keeps climbing
        mode: max
        save_top_k: 3
        save_last: true
        filename: "epoch={epoch}-R10={val_R@10:.3f}-val_loss={val_loss:.4f}"
        auto_insert_metric_name: false   # template already names metrics; avoids "epoch=epoch=..."
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_R@10
        patience: 70
        mode: max
