# python trainer.py fit --config config.yaml
seed_everything: 42

# ──────────────────────────────────────────────────────────
# Model
# ──────────────────────────────────────────────────────────
model:
  latent_dim: 64        # shared embedding space dimension D
  temperature: 0.07      # InfoNCE softmax temperature
  lr: 2.0e-4             # overridden per-step by WarmupCosineLR callback
  weight_decay: 0.2

  # Register modalities: {name: {input_dim, hidden_dim}}
  # input_dim  = output dimension of the frozen encoder's CLS token.
  #              Set to null to auto-detect from the .npy file shape at runtime.
  # hidden_dim = MLP hidden width; null → single linear projection
  modalities:
    image:
      input_dim: null     # auto-detected from image.npy (astrodino_f150w_vitb_ps6_bs128 → 512)
      hidden_dim: 128
    spectrum:
      input_dim: null     # auto-detected from spectrum.npy (jda_prism_f100lp → 128)
      hidden_dim: 64
  # Future modalities — add here and re-run (no code changes needed):
  # morphology:
  #   input_dim: null
  #   hidden_dim: 256
  # photometry:
  #   input_dim: 64       # or null to auto-detect
  #   hidden_dim: null    # single linear layer

# Optimizer is handled by MultimodalFusionModule.configure_optimizers() using
# model.hparams.lr / weight_decay.  The optimizer: block is intentionally
# omitted here: LightningCLI would try to instantiate it during CLI __init__,
# before setup() has registered the modality projectors, causing an
# "empty parameter list" error.

# ──────────────────────────────────────────────────────────
# Data
# ──────────────────────────────────────────────────────────
data:
  # Paths to precomputed embedding .npy files (N, D) — one per modality.
  # Missing entries should be stored as all-NaN rows.
  # Generated by: XFORMERS_DISABLED=1 python extract_embeddings.py
  modality_paths:
    image:    /home/yacheng/ssl_outthere/encoder_fusion/data/embeddings/image.npy
    spectrum: /home/yacheng/ssl_outthere/encoder_fusion/data/embeddings/spectrum.npy
  batch_size: 256
  num_workers: 4
  train_val_split: 0.9

# ──────────────────────────────────────────────────────────
# Trainer
# ──────────────────────────────────────────────────────────
trainer:
  max_epochs: 100
  accelerator: gpu
  devices: [0]
  strategy: auto
  precision: 16-mixed
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  enable_progress_bar: true
  default_root_dir: ./outputs
  logger: false
  callbacks:
    - class_path: model.callbacks.RunManager
      init_args:
        run_name: fusion_image_spectrum
        base_dir: ./outputs
        config_path: ./config.yaml
    - class_path: model.callbacks.MetricsSaveCallback
      init_args:
        save_every_n_steps: 10
    - class_path: model.callbacks.WarmupCosineLR
      init_args:
        warmup_steps: 200
        base_lr: 2.0e-4
        min_lr: 1.0e-5
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "ckpt-{epoch:02d}-{val_loss:.4f}"
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 20
        mode: min
